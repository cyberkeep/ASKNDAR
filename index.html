<!DOCTYPE html>
<!--
  مركز عمر القيسر لتعليم اللغة الإنجليزية — نظام إدارة مستقل
  ملف واحد متكامل يعمل مباشرة في المتصفح دون الحاجة إلى خادم.
  يحتوي على زرين لتصدير واستيراد كامل البيانات والمدخلات في لوحة التحكم الرئيسية.
-->
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b2340">

  <title>مركز عمر القيسي | نظام إدارة المركز</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
/* =========================================================
   نظام التصميم والأنماط البصرية - مركز عمر القيسي
   ========================================================= */
:root {
  --font: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
  --navy-950: #07182e;
  --navy-900: #0b2340;
  --navy-850: #102b4c;
  --navy-800: #14355c;
  --blue-700: #1d4ed8;
  --blue-600: #2563eb;
  --blue-500: #2f7dfa;
  --blue-400: #5b9aff;
  --blue-100: #dbeafe;
  --blue-50: #eff6ff;
  --bg: #f4f7fb;
  --bg-soft: #eef3f9;
  --surface: #ffffff;
  --text: #10243f;
  --text-soft: #344861;
  --muted: #5a6a7e;
  --muted-light: #647186;
  --line: #e5ebf2;
  --line-strong: #d7e0ea;
  --green: #087a52;
  --green-bg: #e8f8f1;
  --amber: #b7791f;
  --amber-bg: #fff7e6;
  --red: #c53030;
  --red-bg: #fdeeee;
  --violet: #7c5cbf;
  --teal: #0f8b8d;
  --sidebar-w: 272px;
  --topbar-h: 82px;
  --radius-sm: 10px;
  --radius: 14px;
  --radius-lg: 18px;
  --shadow-sm: 0 1px 2px rgba(16, 36, 63, 0.035), 0 5px 16px rgba(16, 36, 63, 0.035);
  --shadow-md: 0 12px 34px rgba(13, 35, 64, 0.09);
  --shadow-lg: 0 24px 70px rgba(7, 24, 46, 0.2);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font);
  background: radial-gradient(circle at 7% 0%, rgba(47, 125, 250, 0.07), transparent 28rem), var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body.modal-open { overflow: hidden; }

/* تحسين تجاوب الصور والأيقونات والمرئيات */
img, svg { max-width: 100%; height: auto; }

button, input, select, textarea { font-family: inherit; font-size: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
::selection { color: #fff; background: var(--blue-600); }
:focus-visible { outline: 3px solid rgba(47, 125, 250, 0.35); outline-offset: 2px; }

.icon { display: inline-block; flex: 0 0 auto; vertical-align: middle; }
[hidden] { display: none !important; }

/* ---------- Layout Shell ---------- */
.app-shell { min-height: 100vh; }
.app-main { min-height: 100vh; margin-right: var(--sidebar-w); display: flex; flex-direction: column; transition: margin 0.3s ease; }
.main-content { width: 100%; max-width: 1720px; margin: 0 auto; padding: 30px 34px 52px; flex: 1; }

/* ---------- Sidebar ---------- */
.sidebar {
  position: fixed; top: 0; bottom: 0; right: 0; width: var(--sidebar-w);
  background: radial-gradient(circle at 110% -8%, rgba(47, 125, 250, 0.28), transparent 23rem),
              linear-gradient(178deg, #0c2748 0%, #091d36 54%, #07182e 100%);
  color: #fff; z-index: 60; overflow: hidden; border-left: 1px solid rgba(255, 255, 255, 0.055);
  transition: transform 0.35s var(--ease);
}
#sidebarInner { height: 100%; display: flex; flex-direction: column; padding: 0 15px 18px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 12px; padding: 22px 8px 21px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
.brand-mark { width: 47px; height: 47px; min-width: 47px; border-radius: 14px; display: grid; place-items: center; background: linear-gradient(145deg, var(--blue-400), var(--blue-600)); color: #fff; font-size: 24px; font-weight: 700; overflow: hidden; }
.brand-mark svg { width: 100%; height: 100%; object-fit: contain; }
.brand-copy strong { display: block; font-size: 15px; color: #fff; }
.brand-copy span { display: block; color: #8fa9c7; font-size: 11px; margin-top: 2px; }
.sidebar-nav { padding-top: 16px; flex: 1; }
.nav-section + .nav-section { margin-top: 19px; }
.nav-label { padding: 0 12px; margin-bottom: 7px; color: #7188a4; font-size: 10.5px; font-weight: 600; }
.nav-link { position: relative; display: flex; align-items: center; gap: 12px; min-height: 45px; padding: 0 13px; margin-bottom: 4px; border-radius: 12px; color: #b6c6d8; font-size: 13.5px; font-weight: 500; transition: all 0.18s ease; }
.nav-link:hover { color: #fff; background: rgba(255, 255, 255, 0.055); transform: translateX(-2px); }
.nav-link.is-active { color: #fff; background: linear-gradient(90deg, rgba(47, 125, 250, 0.24), rgba(47, 125, 250, 0.075)); box-shadow: inset 0 0 0 1px rgba(93, 155, 255, 0.12); }
.nav-badge { margin-inline-start: auto; min-width: 22px; height: 20px; padding: 0 6px; border-radius: 20px; background: rgba(255, 255, 255, 0.1); color: #dce8f4; font-size: 10.5px; display: inline-flex; align-items: center; justify-content: center; }

/* غطاء للقائمة في الهاتف */
.sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(4px);
  z-index: 55;
}
body.sidebar-open .sidebar-backdrop { display: block; }

/* ---------- Topbar ---------- */
.topbar { position: sticky; top: 0; z-index: 40; min-height: var(--topbar-h); background: rgba(255, 255, 255, 0.95); border-bottom: 1px solid rgba(220, 229, 239, 0.9); backdrop-filter: blur(16px); padding: 12px 20px; display: flex; align-items: center; }
#topbarInner { width: 100%; max-width: 1720px; margin: 0 auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.topbar-heading span { display: block; font-size: 10.5px; color: var(--muted); }
.topbar-heading strong { display: block; font-size: 15px; font-weight: 600; color: var(--navy-900); }
.topbar-spacer { flex: 1; }
.topbar-actions { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }

.menu-toggle-btn {
  display: none;
  background: transparent;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  padding: 8px;
  color: var(--navy-900);
}

/* ---------- Components & UI ---------- */
.page-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
.page-title { margin: 0; color: var(--navy-900); font-size: clamp(20px, 2.25vw, 30px); font-weight: 700; }
.page-subtitle { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; }
.page-actions { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }

.btn { min-height: 42px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px; border-radius: 11px; border: 1px solid transparent; font-weight: 600; font-size: 12px; white-space: nowrap; transition: all 0.18s ease; }
.btn--primary { color: #fff; background: linear-gradient(135deg, var(--blue-500), var(--blue-700)); box-shadow: 0 7px 18px rgba(37, 99, 235, 0.2); }
.btn--primary:hover { background: linear-gradient(135deg, #3d88ff, #1e4fd8); }
.btn--secondary { color: var(--text-soft); background: #fff; border-color: var(--line-strong); }
.btn--secondary:hover { color: var(--blue-600); border-color: #b7cff4; background: #fbfdff; }
.btn--ghost { color: var(--muted); background: transparent; }
.btn--ghost:hover { color: var(--text); background: #f2f5f9; }
.btn--danger { color: #fff; background: var(--red); }
.btn--danger:hover { background: #c23838; }
.btn--green { color: #fff; background: var(--green); }
.btn--green:hover { background: #066342; }

/* Data Transfer Box (التصدير والاستيراد) */
.data-transfer-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--blue-50);
  padding: 6px 10px;
  border-radius: var(--radius);
  border: 1px dashed var(--blue-400);
  flex-wrap: wrap;
}

.btn--pwa {
  color: #fff;
  background: linear-gradient(135deg, #10b981, #059669);
  box-shadow: 0 7px 18px rgba(16, 185, 129, 0.25);
  animation: pulse-pwa 2s infinite;
}
.btn--pwa:hover {
  background: linear-gradient(135deg, #34d399, #047857);
}

@keyframes pulse-pwa {
  0% { transform: scale(1); }
  50% { transform: scale(1.02); }
  100% { transform: scale(1); }
}

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
.panel-pad { padding: 20px; }
.panel-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 20px 22px 0; }
.panel-header h2 { margin: 0; color: var(--navy-900); font-size: 15px; font-weight: 600; }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.stat-card { position: relative; overflow: hidden; background: #fff; border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 18px 18px 14px; box-shadow: var(--shadow-sm); }
.stat-main { display: flex; align-items: flex-start; gap: 12px; }
.stat-icon { width: 42px; height: 42px; min-width: 42px; border-radius: 12px; background: var(--blue-50); color: var(--blue-600); display: grid; place-items: center; }
.stat-label { display: block; color: var(--muted); font-size: 11.5px; margin-bottom: 2px; }
.stat-value { display: block; color: var(--navy-900); font-size: clamp(20px, 2vw, 28px); font-weight: 700; }
.stat-value .currency { font-size: 11px; color: var(--muted); font-weight: 500; }

.dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.72fr) minmax(280px, 0.88fr); gap: 18px; margin-top: 18px; }
/* ... existing code ... -->
/* ---------- Chart & Analytics Components ---------- */
.chart-container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 14px 0;
  flex-wrap: wrap;
}
.chart-donut {
  position: relative;
  width: 140px;
  height: 140px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  margin: 0 auto;
}
.chart-donut-hole {
  width: 96px;
  height: 96px;
  background: #fff;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.06);
}
.chart-legend {
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 1;
  min-width: 160px;
}
.legend-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
}
.legend-marker {
  width: 10px;
  height: 10px;
  border-radius: 3px;
  display: inline-block;
  margin-inline-end: 6px;
}

.table-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; }

/* ---------- Cards View Grid System ---------- */
.view-toggle-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

/* تحسين وتجميل مربع البحث */
.search-field-wrapper {
  position: relative;
  width: 100%;
  max-width: 360px;
}
.search-field-wrapper .search-icon {
  position: absolute;
  top: 50%;
  right: 14px;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
  transition: color 0.2s ease;
}
.search-field {
  width: 100%;
  height: 44px;
  padding: 0 42px 0 16px;
  border-radius: var(--radius);
  border: 1px solid var(--line-strong);
  background: #ffffff;
  color: var(--navy-900);
  font-size: 13px;
  font-weight: 500;
  box-shadow: 0 2px 6px rgba(16, 36, 63, 0.02);
  transition: all 0.2s var(--ease);
}
.search-field:focus {
  border-color: var(--blue-500);
  box-shadow: 0 0 0 4px rgba(47, 125, 250, 0.12);
  outline: none;
}
.search-field:focus + .search-icon {
  color: var(--blue-600);
}

.view-btn-group {
  display: inline-flex;
  background: var(--bg-soft);
  padding: 3px;
  border-radius: 12px;
  border: 1px solid var(--line-strong);
}
.view-btn {
  padding: 7px 16px;
  font-size: 12px;
  font-weight: 600;
  border-radius: 9px;
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.18s ease;
}
.view-btn.is-active {
  background: #fff;
  color: var(--navy-900);
  box-shadow: var(--shadow-sm);
}

/* تحسين تنسيق الجداول التفاعلية */
.table-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.table-responsive {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.table {
  width: 100%;
  border-collapse: collapse;
  text-align: right;
  font-size: 13px;
}
.table th {
  background: #f8fafc;
  color: var(--muted-light);
  font-weight: 600;
  font-size: 11.5px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line-strong);
  white-space: nowrap;
}
.table td {
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
  color: var(--text-soft);
  vertical-align: middle;
  white-space: nowrap;
}
.table tbody tr {
  transition: background-color 0.15s ease;
}
.table tbody tr:hover {
  background-color: var(--blue-50);
}
.table tbody tr:last-child td {
  border-bottom: none;
}

.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 16px;
}
.item-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 16px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 12px;
  position: relative;
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}
.item-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}
.item-card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 10px;
}
.item-card-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--navy-900);
  margin: 0;
}
.item-card-sub {
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 2px;
}
.item-card-body {
  display: grid;
  gap: 8px;
  font-size: 12px;
}
.info-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--text-soft);
}
.info-row span { color: var(--muted); }
.info-row strong { color: var(--navy-900); font-weight: 600; }

.item-card-footer {
  border-top: 1px solid var(--line);
  padding-top: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

/* ---------- Modal & Toast ---------- */
#modalRoot:not(.is-open) { display: none; }
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 120;
  background: rgba(6, 23, 44, 0.55);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  animation: fadeIn 0.15s ease-out;
}
.modal {
  width: 100%;
  max-width: 580px;
  background: #fff;
  border-radius: 18px;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  max-height: 90vh;
  animation: slideUp 0.18s var(--ease);
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(12px) scale(0.98); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }

.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--line); background: #fbfdfe; }
.modal-body { padding: 20px; overflow-y: auto; flex: 1; }
.modal-footer { display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); background: #f9fbfd; flex-wrap: wrap; }

.toast-stack { position: fixed; z-index: 220; bottom: 22px; inset-inline-start: 22px; inset-inline-end: 22px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 9px; padding: 11px 16px; background: #fff; border: 1px solid var(--line); border-radius: 11px; box-shadow: 0 12px 32px rgba(13, 35, 64, 0.15); font-size: 12px; pointer-events: auto; }
.toast--success { border-inline-start: 4px solid var(--green); }
.toast--error { border-inline-start: 4px solid var(--red); }

/* ---------- تحسينات الهواتف والشاشات الصغيرة ---------- */
@media (max-width: 1080px) {
  .app-main { margin-right: 0; }
  .sidebar { transform: translateX(100%); }
  body.sidebar-open .sidebar { transform: translateX(0); }
  .menu-toggle-btn { display: inline-flex; }
  .main-content { padding: 20px 16px 40px; }
  .topbar { padding: 10px 16px; }
  .dashboard-grid { grid-template-columns: 1fr; }
  .topbar-actions { width: 100%; justify-content: space-between; }
  .data-transfer-box { width: 100%; justify-content: space-between; }
  .btn--pwa { width: 100%; }
}
  </style>
</head>

      <div id="sidebarInner"></div>
    </aside>
    <div class="app-main">
      <header class="topbar" id="topbar">
        <div id="topbarInner"></div>
      </header>
      <main class="main-content" id="mainContent">
        <div id="pageRoot"></div>
      </main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div class="toast-stack" id="toastRoot"></div>
  <input type="file" id="importFileInput" accept=".json" style="display: none;">

  <script>
(function (App) {
  'use strict';

  // --------- إعداد وتفعيل PWA و Service Worker بشكل كامل مخصص لمتصفح Brave والمتصفحات الأخرى ---------
  App.initPWA = () => {
    // 1. كود SVG المباشر للشعار الفاخر
    App.rawSvgIcon = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' width='100%' height='100%'>
      <rect width='512' height='512' fill='#07182e'/>
      <rect x='16' y='16' width='480' height='480' fill='none' stroke='#f6d365' stroke-width='12' stroke-opacity='0.8'/>
      <g>
        <path d='M128 320c48-24 96-12 128 12 32-24 80-36 128-12v-120c-48-24-96-12-128 12-32-24-80-36-128-12z' fill='#2563eb'/>
        <path d='M256 212v120' stroke='#ffffff' stroke-width='8' stroke-linecap='round'/>
        <path d='M256 120l144 64-144 64-144-64z' fill='#f6d365'/>
        <path d='M160 212v52c0 32 43 58 96 58s96-26 96-58v-52' fill='none' stroke='#f6d365' stroke-width='16' stroke-linecap='round'/>
        <path d='M376 190v72' stroke='#f6d365' stroke-width='10' stroke-linecap='round'/>
        <circle cx='376' cy='268' r='12' fill='#f6d365'/>
      </g>
    </svg>`;

    // توليد أيقونة PNG مصمتة بدقة عالية وموافقة لحماية Brave
    const generatePngDataUrl = (size) => {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      
      // خلفية كحلية داكنة معبأة بالكامل
      ctx.fillStyle = '#07182e';
      ctx.fillRect(0, 0, size, size);

      // إطار ذهبي
      ctx.strokeStyle = '#f6d365';
      ctx.lineWidth = size * 0.04;
      ctx.strokeRect(size * 0.05, size * 0.05, size * 0.9, size * 0.9);

      // قبعة التخرج
      ctx.fillStyle = '#f6d365';
      ctx.beginPath();

      ctx.fill();

      ctx.beginPath();

      ctx.fill();

      // كتاب باللون الأبيض
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(size * 0.28, size * 0.68, size * 0.44, size * 0.14);

(function (App) {
  'use strict';
  // --------- متجر البيانات (Store & Storage) ---------
  const KEY = 'alqaysar_center_data_v2';

  const Store = {
    load: () => {
      try {
        const raw = localStorage.getItem(KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {
        console.warn('خطأ في تحميل البيانات المحفوظة، سيتم تحميل البيانات الافتراضية.');
      }
      const seed = App.createSeedData();
      Store.save(seed);
      return seed;
    },
    save: (state) => {
      try {
        localStorage.setItem(KEY, JSON.stringify(state));
        return true;
      } catch (e) {
        console.error('تعذر حفظ البيانات في المتصفح.');
        return false;
      }
    },
    // تصدير البيانات كاملة إلى ملف JSON
    exportData: () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(App.state, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `مركز_عمر_القيسي_نسخة_احتياطية_${App.Utils.todayISO()}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      App.UI.toast('تم تصدير جميع البيانات بنجاح!', 'success');
    },
    // استيراد البيانات من ملف JSON
    importData: (file) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported && imported.students && imported.teachers) {
            App.state = imported;
            Store.save(App.state);
            App.renderSidebar();
            App.renderTopbar();
            App.render();
            App.UI.toast('تم استيراد واستعادة البيانات بنجاح!', 'success');
          } else {
            App.UI.toast('الملف المحدد غير صالح أو تالف.', 'error');
          }
        } catch (err) {
          App.UI.toast('حدث خطأ أثناء قراءة الملف.', 'error');
        }
      };
      reader.readAsText(file);
    }
  };

  App.Store = Store;
})(window.App = window.App || {});

      root.innerHTML = `

        root.className = 'modal-overlay';

          <div>الاشتراك الكلي: <strong>${App.Utils.money(st.subscription)}</strong></div>
          <div>المدفوع سابقاً: <strong style="color:var(--green);">${App.Utils.money(st.paid)}</strong></div>
          <div>المتبقي حالياً: <strong style="color:var(--red);">${App.Utils.money(state.remaining)}</strong></div>
        </div>
        <div>
          <label style="display:block; font-size:11px; font-weight:600; margin-bottom:4px;">مبلغ الدفعة الجديدة (د.أ) *</label>
          <input type="number" id="m_pay_amount" class="search-field" style="width:100%;" value="${state.remaining}">
        </div>
      </div>
    `;

    App.UI.openModal('تسديد دفعة مالية', html, () => {
      const payAmount = Number(document.getElementById('m_pay_amount').value) || 0;
      if (payAmount <= 0) {
        App.UI.toast('يرجى كتابة قيمة الدفعة', 'error');
        return false;
      }

      st.paid += payAmount;
      App.state.payments.push({
        id: App.Utils.uid('p'),
        studentId: st.id,
        amount: payAmount,
        date: App.Utils.todayISO()
      });

      App.Store.save(App.state);
      App.render();
      App.UI.toast('تم تسديد الدفعة بنجاح');
      return true;
    });
  };

  App.deleteStudent = (studentId) => {
    App.UI.openModal('حذف طالب', '<p style="margin:0; font-size:13px;">هل أنت تأكد من حذف هذا الطالب نهائياً من النظام؟</p>', () => {
      App.state.students = App.state.students.filter(s => s.id !== studentId);
      App.Store.save(App.state);
      App.render();
      App.UI.toast('تم حذف الطالب');
      return true;
    });
  };

  // --------- نماذج وإجراءات المعلمين السريعة ----------
  App.showTeacherFormModal = (teacherId) => {
    const isEdit = !!teacherId;
    const t = isEdit ? App.state.teachers.find(x => x.id === teacherId) : { name: '', phone: '', specialty: 'اللغة الإنجليزية', salary: 400 };

    const html = `
      <div style="display:grid; gap:12px;">
        <div>
          <label style="display:block; font-size:11px; font-weight:600; margin-bottom:4px;">اسم المعلم *</label>
          <input type="text" id="m_t_name" class="search-field" style="width:100%;" value="${App.Utils.escapeHTML(t.name)}" placeholder="الاسم الكامل">
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
          <div>
            <label style="display:block; font-size:11px; font-weight:600; margin-bottom:4px;">رقم الهاتف</label>
            <input type="text" id="m_t_phone" class="search-field" style="width:100%;" value="${App.Utils.escapeHTML(t.phone)}">
          </div>
          <div>
            <label style="display:block; font-size:11px; font-weight:600; margin-bottom:4px;">التخصص</label>
            <input type="text" id="m_t_spec" class="search-field" style="width:100%;" value="${App.Utils.escapeHTML(t.specialty)}">
          </div>
        </div>
        <div>
          <label style="display:block; font-size:11px; font-weight:600; margin-bottom:4px;">الراتب الشهري (د.أ)</label>
          <input type="number" id="m_t_salary" class="search-field" style="width:100%;" value="${t.salary}">
        </div>
      </div>
    `;

    App.UI.openModal(isEdit ? 'تعديل بيانات المعلم' : 'إضافة معلم جديد', html, () => {
      const name = document.getElementById('m_t_name').value.trim();
      if (!name) { App.UI.toast('يرجى كتابة اسم المعلم', 'error'); return false; }
      const phone = document.getElementById('m_t_phone').value.trim();
      const spec = document.getElementById('m_t_spec').value.trim() || 'اللغة الإنجليزية';
      const salary = Number(document.getElementById('m_t_salary').value) || 0;

      if (isEdit) {
        t.name = name; t.phone = phone; t.specialty = spec; t.salary = salary;
      } else {
        App.state.teachers.push({ id: App.Utils.uid('t'), name, phone, specialty: spec, salary, status: 'active' });
      }

      App.Store.save(App.state);
      App.renderSidebar();
      App.render();
      App.UI.toast(isEdit ? 'تم تعديل المعلم بنجاح' : 'تم إضافة المعلم بنجاح');
      return true;
    });
  };

  App.deleteTeacher = (teacherId) => {
    App.UI.openModal('حذف معلم', '<p style="margin:0; font-size:13px;">هل أنت تأكد من حذف هذا المعلم؟</p>', () => {
      App.state.teachers = App.state.teachers.filter(t => t.id !== teacherId);
      App.Store.save(App.state);
      App.renderSidebar();
      App.render();
      App.UI.toast('تم حذف المعلم');
      return true;
    });
  };

  // --------- نماذج وإجراءات السائقين ----------
  App.showDriverFormModal = (driverId) => {
    const isEdit = !!driverId;
    const d = isEdit ? App.state.drivers.find(x => x.id === driverId) : { name: '', phone: '', route: 'خط المركز', carModel: 'تويوتا' };

    const html = `
      <div style="display:grid; gap:12px;">
        <div>
          <label style="display:block; font-size:11px; font-weight:600; margin-bottom:4px;">اسم السائق *</label>
          <input type="text" id="m_d_name" class="search-field" style="width:100%;" value="${App.Utils.escapeHTML(d.name)}">
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
          <div>
            <label style="display:block; font-size:11px; font-weight:600; margin-bottom:4px;">رقم الهاتف</label>
            <input type="text" id="m_d_phone" class="search-field" style="width:100%;" value="${App.Utils.escapeHTML(d.phone)}">
          </div>
          <div>
            <label style="display:block; font-size:11px; font-weight:600; margin-bottom:4px;">نوع المركبة</label>
            <input type="text" id="m_d_car" class="search-field" style="width:100%;" value="${App.Utils.escapeHTML(d.carModel)}">
          </div>
        </div>
        <div>
          <label style="display:block; font-size:11px; font-weight:600; margin-bottom:4px;">خط السير / المسار</label>
          <input type="text" id="m_d_route" class="search-field" style="width:100%;" value="${App.Utils.escapeHTML(d.route)}">
        </div>
      </div>
    `;

    App.UI.openModal(isEdit ? 'تعديل بيانات السائق' : 'إضافة سائق جديد', html, () => {
      const name = document.getElementById('m_d_name').value.trim();
      if (!name) { App.UI.toast('يرجى كتابة اسم السائق', 'error'); return false; }
      const phone = document.getElementById('m_d_phone').value.trim();
      const car = document.getElementById('m_d_car').value.trim();
      const route = document.getElementById('m_d_route').value.trim();

      if (isEdit) {
        d.name = name; d.phone = phone; d.carModel = car; d.route = route;
      } else {
        App.state.drivers.push({ id: App.Utils.uid('d'), name, phone, carModel: car, route, status: 'available' });
      }

      App.Store.save(App.state);
      App.render();
      App.UI.toast(isEdit ? 'تم تعديل السائق بنجاح' : 'تم إضافة السائق بنجاح');
      return true;
    });
  };

  App.deleteDriver = (driverId) => {
    App.UI.openModal('حذف سائق', '<p style="margin:0; font-size:13px;">هل أنت تأكد من حذف هذا السائق؟</p>', () => {
      App.state.drivers = App.state.drivers.filter(d => d.id !== driverId);
      App.Store.save(App.state);
      App.render();
      App.UI.toast('تم حذف السائق');
      return true;
    });
  };

  // --------- دالة الرندر الشاملة للتبويبات ----------
  App.render = () => {
    const pageRoot = document.getElementById('pageRoot');
    if (!pageRoot) return;

    switch (App.currentTab) {
      case 'dashboard':
        App.renderDashboard(pageRoot);
        break;
      case 'students':
        App.renderStudents(pageRoot);
        break;
      case 'teachers':
        App.renderTeachers(pageRoot);
        break;
      case 'drivers':
        App.renderDrivers(pageRoot);
        break;
      case 'finance':
        App.renderFinance(pageRoot);
        break;
      default:
        App.renderDashboard(pageRoot);
        break;
    }
  };

  // --------- رسم القائمة الجانبية والشريط العلوي ---------
  App.renderSidebar = () => {
    const sidebar = document.getElementById('sidebarInner');
    if (!sidebar) return;

    sidebar.innerHTML = `
      <div class="brand">
        <div class="brand-mark">
          ${App.rawSvgIcon}
        </div>
        <div class="brand-copy">
          <strong>مركز عمر القيسي</strong>
          <span>تعليم اللغة الإنجليزية</span>
        </div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-label">الرئيسية</div>
          <a href="#" class="nav-link ${App.currentTab === 'dashboard' ? 'is-active' : ''}" data-tab="dashboard">
            ${App.icon('dashboard')} <span>لوحة التحكم</span>
          </a>
        </div>
        <div class="nav-section">
          <div class="nav-label">الإدارة والصفوف</div>
          <a href="#" class="nav-link ${App.currentTab === 'students' ? 'is-active' : ''}" data-tab="students">
            ${App.icon('users')} <span>الطلاب</span>
            <span class="nav-badge">${App.state.students.length}</span>
          </a>
          <a href="#" class="nav-link ${App.currentTab === 'teachers' ? 'is-active' : ''}" data-tab="teachers">
            ${App.icon('graduation-cap')} <span>المعلمون</span>
            <span class="nav-badge">${App.state.teachers.length}</span>
          </a>
          <a href="#" class="nav-link ${App.currentTab === 'drivers' ? 'is-active' : ''}" data-tab="drivers">
            ${App.icon('bus')} <span>المواصلات والسائقون</span>
          </a>
        </div>
        <div class="nav-section">
          <div class="nav-label">المالية</div>
          <a href="#" class="nav-link ${App.currentTab === 'finance' ? 'is-active' : ''}" data-tab="finance">
            ${App.icon('wallet')} <span>الحسابات والمصروفات</span>
          </a>
        </div>
      </nav>
    `;

    sidebar.querySelectorAll('.nav-link').forEach(link => {
      link.onclick = (e) => {
        e.preventDefault();
        App.currentTab = link.dataset.tab;
        App.renderSidebar();
        App.render();
      };
    });
  };

  App.renderTopbar = () => {
    const topbar = document.getElementById('topbarInner');
    if (!topbar) return;

    topbar.innerHTML = `
      <button class="menu-toggle-btn" id="menuToggleBtn">${App.icon('dashboard', 22)}</button>
      <div class="topbar-heading">
        <span>مركز عمر القيسي</span>
        <strong>النظام الإداري المحوسب</strong>
      </div>
      <div class="topbar-spacer"></div>
      
      <div class="topbar-actions">
        <!-- زر تثبيت الـ PWA -->
        <button type="button" class="btn btn--pwa" id="btnInstallPWA">
          ${App.icon('download', 18)} <span>تحميل التطبيق (Brave / الكمبيوتر)</span>
        </button>

        <!-- زر التصدير والاستيراد -->
        <div class="data-transfer-box">
          <button type="button" class="btn btn--secondary" id="btnExportData" style="min-height:34px; padding:0 10px; font-size:11px;">
            ${App.icon('download', 14)} <span>تصدير البيانات</span>
          </button>
          <button type="button" class="btn btn--secondary" id="btnImportData" style="min-height:34px; padding:0 10px; font-size:11px;">
            ${App.icon('upload', 14)} <span>استيراد البيانات</span>
          </button>
        </div>
      </div>
    `;

    // ربط زر القائمة الهامبرغر في الهواتف
    document.getElementById('menuToggleBtn').onclick = () => {
      document.body.classList.toggle('sidebar-open');
    };
    document.getElementById('sidebarBackdrop').onclick = () => {
      document.body.classList.remove('sidebar-open');
    };

    // ربط زر التصدير والاستيراد
    document.getElementById('btnExportData').onclick = () => App.Store.exportData();
    document.getElementById('btnImportData').onclick = () => document.getElementById('importFileInput').click();

    // ربط زر التثبيت الـ PWA
    const installBtn = document.getElementById('btnInstallPWA');
    if (installBtn) {
      installBtn.onclick = async () => {
        if (App.deferredPrompt) {
          App.deferredPrompt.prompt();
          const { outcome } = await App.deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            App.deferredPrompt = null;
            installBtn.style.display = 'none';
          }
        } else {
          App.UI.openModal(
            'تثبيت التطبيق على متصفح Brave / الأجهزة',
            `
              <div style="font-size:13px; line-height:1.7;">
                <p>لتثبيت التطبيق بسهولة على متصفح Brave أو Chrome أو الأيفون:</p>
                <ol style="padding-inline-start:20px; margin:10px 0;">
                  <li>في متصفح Brave/Chrome: انقر على أيقونة التثبيت <strong>(⊕)</strong> في نهاية شريط الرابط بالأعلى.</li>
                  <li>أو من قائمة المتصفح (⋮) اختر <strong>"إضافة إلى الشاشة الرئيسية"</strong> أو <strong>"Install Application"</strong>.</li>
                </ol>
              </div>
            `,
            null
          );
        }
      };
    }
  };

  // --------- تهيئة النظام وتثبيت الأحداث ---------
  App.init = () => {
    App.state = App.Store.load();
    App.currentTab = 'dashboard';

    App.initPWA();
    App.renderSidebar();
    App.renderTopbar();
    App.render();

    // ربط ملف الاستيراد
    const fileInput = document.getElementById('importFileInput');
    if (fileInput) {
      fileInput.onchange = (e) => {
        if (e.target.files && e.target.files[0]) {
          App.Store.importData(e.target.files[0]);
          fileInput.value = '';
        }
      };
    }
  };

  // تشغيل النظام فور جاهزية الصفحة
  window.onload = () => {
    App.init();
  };

})(window.App = window.App || {});
  </script>
</body>
</html>
